name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/clinical_trial_eligibility_matcher
          cp index.html styles.css app.js _site/
          cp clinical_trial_eligibility_matcher/__init__.py _site/clinical_trial_eligibility_matcher/
          cp clinical_trial_eligibility_matcher/models.py _site/clinical_trial_eligibility_matcher/
          cp clinical_trial_eligibility_matcher/engine.py _site/clinical_trial_eligibility_matcher/
          touch _site/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
