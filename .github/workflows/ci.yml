name: CI

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile sources
        run: python -m compileall -q cli.py clinical_trial_eligibility_matcher tests

      - name: Run tests
        run: python -m pytest -p no:zarr -q

      - name: Verify installed CLI
        run: clinical-trial-eligibility-matcher --list-trials

      - name: Batch smoke test
        run: |
          clinical-trial-eligibility-matcher batch -i sample.csv -o out_ci.csv
          test -s out_ci.csv
          rm out_ci.csv
